name: Verify and release
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
  queue: max
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Select next release version
        if: github.event_name == 'push'
        run: node scripts/next-version.mjs
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: NJITxRMP-chrome
          path: dist/chrome/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: NJITxRMP-firefox
          path: dist/firefox/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: NJITxRMP-source
          path: releases/NJITxRMP-source.zip
          if-no-files-found: error
      - name: Publish tagged release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" releases/*.zip --clobber
          else
            gh release create "$RELEASE_TAG" releases/*.zip --target "$GITHUB_SHA" --title "NJITxRMP $RELEASE_TAG" --generate-notes --latest
          fi

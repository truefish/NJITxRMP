name: Verify and release
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: NJITxRMP-chrome
          path: dist/chrome/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: NJITxRMP-firefox
          path: dist/firefox/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: NJITxRMP-source
          path: releases/NJITxRMP-source.zip
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: NJITxRMP-chrome
          path: dist/chrome
      - uses: actions/download-artifact@v4
        with:
          name: NJITxRMP-firefox
          path: dist/firefox
      - run: node scripts/package.mjs
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" releases/*.zip --draft --generate-notes
